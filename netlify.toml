[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  included_files = ["content/catalog.json"]

# Không cho static host phục vụ catalog hoặc cấu hình nội bộ từ publish root.
[[redirects]]
  from = "/content/*"
  to = "/index.html"
  status = 404
  force = true

# Goi /api/state se chay function state.js
[[redirects]]
  from = "/api/state"
  to = "/.netlify/functions/state"
  status = 200

[[redirects]]
  from = "/api/orders"
  to = "/.netlify/functions/orders"
  status = 200

[[redirects]]
  from = "/api/order-lookup"
  to = "/.netlify/functions/order-lookup"
  status = 200

[[redirects]]
  from = "/api/admin-orders"
  to = "/.netlify/functions/admin-orders"
  status = 200

[[redirects]]
  from = "/api/sepay"
  to = "/.netlify/functions/sepay"
  status = 200

[[redirects]]
  from = "/api/player/redeem"
  to = "/.netlify/functions/player-redeem"
  status = 200

[[redirects]]
  from = "/api/player/admin-course"
  to = "/.netlify/functions/player-admin-course"
  status = 200

[[redirects]]
  from = "/api/auth"
  to = "/.netlify/functions/auth"
